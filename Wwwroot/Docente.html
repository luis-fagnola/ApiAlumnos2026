<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Alumnos 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    
    <nav class="navbar navbar-expand-lg bg-primary shadow-sm" data-bs-theme="dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="Index.html">Notas Alumnos</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="Docente.html">Docentes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="Resultados.html">Resultados</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="Asignatura.html">Asignaturas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="Alumnos.html">Alumnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="PromedioAlumnos.html">Promedio Alumnos</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!--  titulo boton de agregar y tabla de docentes -->
    <div class="container mt-4">

        <h1>Docentes</h1>
        <hr>
       
        <button class="mt-3 mb-3 btn btn-success" data-bs-toggle="modal" data-bs-target="#modalDocentes">
            Agregar Docente
        </button>

        <!-- Tabla donde se listan todos los docentes -->
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Sexo</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaDocentes">
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal para agregar un nuevo docente alta o edicion -->
    <div id="modalDocentes" class="modal fade" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                
                <form id="formDocentes" class="needs-validation" novalidate>
                
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Agregar Nuevo Docente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row">

                        <input type="hidden" id="DocenteId">

                        <label class="form-label">Nombre</label>
                        <input type="text" id="Nombre" class="form-control" required>
                        <div class="invalid-feedback" id="errorNombreDocente"></div>

                        <label class="form-label mt-2">Apellido</label>
                        <input type="text" id="Apellido" class="form-control" required>
                        <div class="invalid-feedback" id="errorApellidoDocente"></div>

                        <label class="form-label mt-2">DNI</label>
                        <input type="text" id="Dni" class="form-control" required>
                        <div class="invalid-feedback" id="errorDniDocente"></div>

                        <label class="form-label mt-2">Sexo</label>
                        <select id="Sexo" class="form-select" required>
                            <option value="">Seleccione una opcion</option>
                            <option value="1">Masculino</option>
                            <option value="2">Femenino</option>
                            <option value="3">Otro</option>
                        </select>
                        <div class="invalid-feedback" id="errorSexoDocente"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-primary" onclick="GuardarDocente()">
                        Guardar
                    </button>
                </div>
                </form> 

            </div>
        </div>
    </div>


    
    <!-- Modal Editar Docente -->
    <div id="editarDocenteModal" class="modal fade" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Docente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <input type="hidden" id="editarId">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="editarNombre" class="form-control">
                        <label class="form-label mt-2">Apellido</label>
                        <input type="text" id="editarApellido" class="form-control">
                        <label class="form-label mt-2">DNI</label>
                        <input type="text" id="editarDni" class="form-control">
                        <label class="form-label mt-2">Sexo</label>
                        <select id="editarSexo" class="form-select">
                            <option value="1">Masculino</option>
                            <option value="2">Femenino</option>
                            <option value="3">Otro</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="EditarDocente()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Js/Docente.js"></script>

</body>
</html>
