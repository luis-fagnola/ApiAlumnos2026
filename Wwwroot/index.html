</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary shadow-sm" data-bs-theme="dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="Index.html">  Notas Alumnos</a>

    <div class="container mt-4">

        <h1>Notas Alumnos</h1>
        <hr>
        <button class="mt-3 mb-3 btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAlumnos">
            Agregar Nueva Nota
        </button>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
                <thead>
                    <tr>
                       
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Nota</th>
                        <th>Fecha</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaAlumnos">
                </tbody>
            </table>
        </div>

    </div>

    <div id="modalAlumnos" class="modal fade" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                
                <form id="formAlumnos" class="needs-validation" novalidate>
                
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Agregar Nueva Nota</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row">

                        <input type="hidden" id="AlumnoId">

                        <div class="mb-3">
                            <label for="selectAlumno" class="form-label">Alumno</label>
                            <select id="selectAlumno" class="form-control">
                                <option value="" disabled selected>Seleccionar alumno</option>
                            </select>
                            <div class="invalid-feedback" id="errorSelectAlumno"></div>
                        </div>

                        <div class="mb-3">
                            <label for="selectAsignaturas" class="form-label">Asignatura</label>
                            <select id="selectAsignaturas" class="form-control">
                                <option value="" disabled selected>Seleccionar asignatura</option>
                            </select>
                            <div class="invalid-feedback" id="errorSelectAsignatura"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" id="Fecha" class="form-control" required>
                            <div class="invalid-feedback" id="errorFechaAlumno"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nota</label>
                            <input type="number" id="Nota" class="form-control" min="1" max="10" step="0.1" required>
                            <div class="invalid-feedback" id="errorNotaAlumno"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-primary" onclick="BuscarAlumnoId()">
                        Guardar
                    </button>
                </div>
                </form> 

            </div>
        </div>
    </div>


    <!-- Modal Editar Alumno -->
    <div id="editarAlumnoModal" class="modal fade" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Alumno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <input type="hidden" id="editarId">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="editarNombre" class="form-control">
                        <label class="form-label mt-2">Apellido</label>
                        <input type="text" id="editarApellido" class="form-control">
                        <label class="form-label mt-2">DNI</label>
                        <input type="text" id="editarDni" class="form-control">
                        <label class="form-label mt-2">Nota</label>
                        <input type="number" id="editarNota" class="form-control" min="1" max="10" step="0.1">
                        <label class="form-label mt-2">Fecha</label>
                        <input type="date" id="editarFecha" class="form-control">
                        <label class="form-label mt-2">Asignatura</label>
                        <select id="editarAsignatura" class="form-control"></select>
                       
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="EditarAlumno()">Guardar</button>
                </div>
            </div>
        </div>
    </div>


<!-- Modal Historial Alumno -->
<div id="historialAlumnoModal" class="modal fade" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content shadow border-0">
            <div class="modal-header">
                <h5 class="modal-title">Historial de Cambios</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table table-striped table-hover table-bordered align-middle">
                    <thead>
                        <tr>
                            <th>Campo Modificado</th>
                            <th>Valor Anterior</th>
                            <th>Valor Nuevo</th>
                            <th>Fecha Cambio</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial">
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>



    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Js/NotaAlumnos.js"></script>
